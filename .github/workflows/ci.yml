name: CI

# main에 push할 때와 PR에서 실행합니다. 예전에는 모든 push + PR이라 PR마다 같은 검사가
# 두 번 돌았습니다. (봇의 state 커밋은 GITHUB_TOKEN으로 push되어 CI를 다시 트리거하지 않습니다.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11: GitHub Actions 운영 버전 / 3.10: README·pyproject가 밝힌 최소 지원 버전
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy gsai_notifier.py

      - name: Pytest
        run: pytest
