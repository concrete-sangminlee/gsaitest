name: GSAI RSS → Slack Notify

on:
  schedule:
    # 아래 시각은 한국 시간(KST=UTC+9)을 UTC로 변환한 값입니다.
    # GitHub Actions 스케줄은 UTC 기준으로 동작하며, 플랫폼 특성상 수 분 지연될 수 있습니다.
    - cron: "7 1 * * *"    # 10:07 KST
    - cron: "14 5 * * *"   # 14:14 KST (오후 2:14)
    - cron: "13 10 * * *"  # 19:13 KST (오후 7:13)
  workflow_dispatch:

permissions:
  contents: write

# 실행이 겹치면(지연된 스케줄 실행 중에 수동 실행 등) 같은 글을 두 번 보내고
# 한쪽 push가 실패합니다. 한 번에 하나만 돌고 나머지는 기다리게 합니다.
concurrency:
  group: gsai-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 트리거 시점 SHA가 아니라 항상 최신 main을 읽습니다. 그렇지 않으면 대기하던
          # 실행이나 "Re-run"이 오래된 state.json으로 돌아 이미 보낸 글을 다시 보냅니다.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notifier
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          FEED_URLS: "https://gsai.snu.ac.kr/feed/,https://gsai.snu.ac.kr/category/board-89-GN-l9dVZfzi-20220217142222/feed/,https://gsai.snu.ac.kr/category/board_3_gn_44wycjtw_20201202131822/feed/,https://gsai.snu.ac.kr/category/board-89-GN-yt0a40XN-20220217142409/feed/,https://gsai.snu.ac.kr/category/board-89-GN-4q7I1Z6R-20220215145657/feed/,https://gsai.snu.ac.kr/category/board-89-GN-lB30HU92-20260227201516/feed/,https://gsai.snu.ac.kr/category/board-89-GN-XLpzHDEo-20220216190236/feed/,https://gsai.snu.ac.kr/category/board-3-SM-C3hoa745-20210308115330/feed/"
          STATE_FILE: "state.json"
          # 수동 실행(workflow_dispatch)에서는 동작 확인을 위해 최신 1개를 한 번 보내고,
          # 스케줄 실행(schedule)에서는 첫 실행에 알림을 보내지 않습니다(스팸/중복 방지).
          INITIAL_NOTIFY_COUNT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          ON_STATE_MISS: "skip"
          MAX_ITEMS_PER_MESSAGE: "10"
          VERIFY_SSL: "true"
        run: |
          python gsai_notifier.py

      - name: Commit state.json (if changed)
        # 알림 단계가 실패해도(피드 하나 장애, Slack 일부 실패) 반드시 실행합니다.
        # 이 단계가 건너뛰어지면 그 실행에서 이미 보낸 글이 기록되지 않아 다음 실행에서
        # 다시 전송됩니다. 알림 단계가 실패했으므로 실행 결과는 그대로 빨간색입니다.
        if: ${{ always() }}
        run: |
          if [ ! -f state.json ]; then
            echo "state.json 없음 (알림 단계가 시작 전에 실패) — 커밋할 것 없음"
            exit 0
          fi
          # untracked 파일도 감지하도록 먼저 stage한 뒤 index 기준으로 비교합니다.
          git add state.json
          if git diff --cached --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "gsai-notifier-bot"
          git config user.email "gsai-notifier-bot@users.noreply.github.com"
          git commit -m "chore: update feed state"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패(${attempt}회) — origin/main과 동기화 후 재시도"
            sleep $((attempt * 3))
            git pull --rebase origin main || { git rebase --abort || true; }
          done
          echo "::error::state.json push 실패 — 다음 실행에서 알림이 재전송될 수 있습니다"
          exit 1


